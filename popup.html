<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelTrack</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="brand">
        <div class="logo">R</div>
        <div>
          <h1>ReelTrack</h1>
          <p>Where did your attention go?</p>
        </div>
      </div>

      <div class="live">
        <span></span>
        LIVE
      </div>
    </header>


    <section class="hero">

      <p class="eyebrow">TODAY'S ATTENTION</p>

      <div class="big-number" id="reelsWatched">
        0
      </div>

      <p class="label">REELS WATCHED</p>

      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress" id="progress"></div>
        </div>

        <div class="progress-info">
          <span id="goalText">0 / 50</span>
          <span id="percentage">0%</span>
        </div>
      </div>

    </section>


    <section class="stats">

      <div class="stat-card">
        <span class="stat-icon">◷</span>
        <p>TIME SPENT</p>
        <strong id="timeSpent">0m 0s</strong>
      </div>

      <div class="stat-card">
        <span class="stat-icon">↗</span>
        <p>AVG / REEL</p>
        <strong id="averageTime">0s</strong>
      </div>

      <div class="stat-card full">
        <span class="stat-icon">◉</span>
        <p>SESSIONS</p>
        <strong id="sessions">0</strong>
      </div>

    </section>


    <section class="insight">

      <div class="insight-icon">✦</div>

      <div>
        <p class="insight-title">YOUR ATTENTION</p>
        <p id="insightText">
          Start watching Reels and I'll find your pattern.
        </p>
      </div>

    </section>


    <footer>

      <span>Personal experiment</span>

      <button id="resetButton">
        Reset today
      </button>

    </footer>

  </main>

  <script src="popup.js"></script>

</body>
</html>
